[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
[paths]
data = __RUNTIME_PATH__/grafana-data
logs = __RUNTIME_PATH__/grafana-logs
plugins = __RUNTIME_PATH__/grafana-plugins
provisioning = __PROVISIONING_PATH__
[security]
admin_user = labadmin
admin_password = __RUNTIME_ADMIN_PASSWORD__
disable_gravatar = true
[users]
allow_sign_up = false
[auth.anonymous]
enabled = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[log]
level = warn
[plugins]
preinstall_disabled = true
preinstall_auto_update = false
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,prometheus,stackdriver,tempo,zipkin
