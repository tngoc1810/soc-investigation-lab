# New isolated lab instance. HTTP and gRPC listen only on loopback.
auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: ./loki-data
  storage:
    filesystem:
      chunks_directory: ./loki-data/chunks
      rules_directory: ./loki-data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2010-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  reject_old_samples: false
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_parallelism: 2
  split_queries_by_interval: 24h
  max_query_series: 1000
  # Internal index/ingester lookups can span years for the pinned historical data.
  max_query_length: 0s
  # This tiny historical lab does not benefit from frontend query sharding.
  min_sharding_lookback: 175200h
  allow_structured_metadata: false
querier:
  max_concurrent: 2
  # Historical EVTX is freshly replayed but can be years old; consult memory too.
  query_ingesters_within: 0s
query_range:
  cache_results: false
analytics:
  reporting_enabled: false
ingester:
  # Filesystem store otherwise derives a recent-only lookback at startup.
  # Negative duration means unlimited, needed for years-old EVTX replay.
  query_store_max_look_back_period: -1s
storage_config:
  tsdb_shipper:
    resync_interval: 5s
