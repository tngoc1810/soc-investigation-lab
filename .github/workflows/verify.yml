name: Verify evidence pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify published evidence checksums
        run: python scripts/verify_checksums.py
      - name: Run documented demo
        run: |
          python -m soclab ingest data/fixtures/demo.jsonl --db output/demo/evidence.sqlite
          python -m soclab analyze --db output/demo/evidence.sqlite --out output/demo/run-01
      - name: Rebuild and verify public EVTX cases on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/reproduce.ps1 -RunId ci
          python scripts/verify_portfolio.py
  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_sigma.py
