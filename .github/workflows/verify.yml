name: Verify evidence pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify published evidence checksums
        run: python scripts/verify_checksums.py
      - name: Run documented demo
        run: |
          python -m soclab ingest data/fixtures/demo.jsonl --db output/demo/evidence.sqlite
          python -m soclab analyze --db output/demo/evidence.sqlite --out output/demo/run-01
      - name: Rebuild and verify public EVTX cases on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/reproduce.ps1 -RunId ci
          python scripts/verify_portfolio.py
          python scripts/build_advanced.py --run-id ci-advanced
          python scripts/verify_advanced.py
          python scripts/build_operations.py --run-id ci-operations
          ./scripts/inspect_ast.ps1 -InputPath output/operations/ci-operations/public-quoted.txt -OutputPath output/operations/ci-operations/public-quoted.ast.json
          python scripts/verify_operations.py --run-id ci-operations
      - name: Evaluate checked-in scenario corpus
        run: python -m soclab evaluate --out output/evaluation.json
      - name: Verify operational outage, restart, case export and snapshot recovery
        run: python scripts/validate_live.py --run-id ci-live --out output/live-validation.json
  sigma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_sigma.py
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare independent evidence collections
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/reproduce.ps1 -RunId ci-backend
          python scripts/build_advanced.py --run-id ci-backend-graph
      - name: Verify pinned native Loki ingestion and actual LogQL responses
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/runtime.ps1 -Action Install -Component Loki
          try {
            ./scripts/runtime.ps1 -Action Start -Component Loki
            python scripts/validate_backend.py --run-id ci-backend --out output/backend-validation.json
            python scripts/validate_live.py --backend --run-id ci-live-backend --out output/live-backend-validation.json
          } finally {
            ./scripts/runtime.ps1 -Action Stop
          }
      - uses: actions/upload-artifact@v4
        with:
          name: actual-loki-responses
          path: |
            output/backend-validation.json
            output/live-backend-validation.json
